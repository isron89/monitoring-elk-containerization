input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
    # Multi-topic configuration: Add your telemetry topics
    topics => ["mypertamina-dev", "mypertamina-staging", "mypertamina-prod"]
    # Alternative: Use pattern matching to subscribe to all telemetry topics
    # topics_pattern => "telemetry-.*"

    group_id => "telemetry-monitor"

    auto_offset_reset => "latest"
    enable_auto_commit => true

    # CHANGE 1: baca dari awal kalau belum ada offset
    # auto_offset_reset => "earliest"
    # CHANGE 2: disable auto commit
    # enable_auto_commit => false

    # Adds Kafka topic metadata to each event
    decorate_events => true

    codec => json {
      ecs_compatibility => "disabled"
    }

    # Optional Security (recommended if Kafka supports it)
    # security_protocol => "SASL_SSL"
    # sasl_mechanism => "PLAIN"
    # sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username='user' password='pass';"
  }
}

filter {
  # Drop messages without required tranTime field
  if ![tranTime] {
    drop {}
  }

  # Parse ISO8601 timestamp to @timestamp
  date {
    match => ["tranTime", "ISO8601"]
    target => "@timestamp"
    ecs_compatibility => "disabled"
  }

  # Mark slow requests (execution time > 3 seconds)
  if [executeTime] and [executeTime] > 3000 {
    mutate {
      add_field => { "slow_request" => "true" }
    }
  }

  # Add topic name as a field for easier filtering in Kibana
  # The [@metadata][kafka][topic] field is available when decorate_events => true
  mutate {
    add_field => { "source_topic" => "%{[@metadata][kafka][topic]}" }
  }

  # Optional: Topic-specific processing
  # Uncomment and customize based on your needs
  # if [@metadata][kafka][topic] == "telemetry-topic-2" {
  #   mutate {
  #     add_field => { "topic_type" => "service_b" }
  #   }
  # }
  # else if [@metadata][kafka][topic] == "telemetry-topic-3" {
  #   mutate {
  #     add_field => { "topic_type" => "service_c" }
  #   }
  # }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Topic-based indices with daily timestamps
    # ILM enabled: Data retention based on environment
    # - Dev: 7 days
    # - Staging: 30 days  
    # - Production: 90 days
    index => "%{source_topic}-%{+YYYY.MM.dd}"

    user => "logstash_writer"
    password => "pertamina"

    # ILM enabled - lifecycle policies applied via index templates
    ilm_enabled => false
    manage_template => false

    timeout => 60
    pool_max => 512
    pool_max_per_route => 100
    resurrect_delay => 5
    validate_after_inactivity => 200
  }

  # Optional: Topic-specific outputs
  # You can add multiple elasticsearch outputs with conditionals
  # Example:
  # if [@metadata][kafka][topic] == "telemetry-topic-2" {
  #   elasticsearch {
  #     hosts => ["http://elasticsearch:9200"]
  #     index => "service-b-telemetry-%{+YYYY.MM.dd}"
  #     user => "logstash_writer"
  #     password => "pertamina"
  #   }
  # }

  stdout {
    codec => rubydebug
  }
}
