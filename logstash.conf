input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["telemetry-topic"]
    group_id => "telemetry-monitor"

    auto_offset_reset => "latest"
    enable_auto_commit => true

    codec => json {
      ecs_compatibility => "disabled"
    }

    # Optional Security (recommended if Kafka supports it)
    # security_protocol => "SASL_SSL"
    # sasl_mechanism => "PLAIN"
    # sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username='user' password='pass';"
  }
}

filter {
  if ![tranTime] {
    drop {}
  }

  date {
    match => ["tranTime", "ISO8601"]
    target => "@timestamp"
    ecs_compatibility => "disabled"
  }

  if [executeTime] and [executeTime] > 3000 {
    mutate {
      add_field => { "slow_request" => "true" }
    }
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "telemetry-%{+YYYY.MM.dd}"

    user => "logstash_writer"
    password => "password"

    ilm_enabled => false
    manage_template => false

    timeout => 60
    pool_max => 512
    pool_max_per_route => 100
    resurrect_delay => 5
    validate_after_inactivity => 200
  }

  stdout {
    codec => rubydebug
  }
}
